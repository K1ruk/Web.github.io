name: NEXUS checks
on:
  pull_request:
    paths:
      - 'cs2-platform/**'
      - '.github/workflows/nexus-checks.yml'
  push:
    branches: [main]
    paths:
      - 'cs2-platform/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cs2-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
